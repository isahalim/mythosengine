name: RENDER

# 3x/day, spread through the day (ARCHITECTURE.md §10's "3 render jobs/day"
# quota framing) — each invocation does exactly one signal end-to-end
# (SCRIPT -> CRITIC -> FOOTAGE SELECT -> TTS -> RENDER -> AUDIT -> EXPORT),
# not a loop of three.
on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch the assets-library branch (footage clips live there, not in this checkout's ref)
        run: git fetch origin assets-library:assets-library || echo "assets-library branch doesn't exist remotely yet — nothing to render against"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Edge TTS (edge_tts_synth.py's only Python dependency)
        run: pip install --user edge-tts

      # Not actually preinstalled on the current ubuntu-latest image, despite
      # GitHub's runner-images docs listing it (confirmed by a live run
      # failing with "ffmpeg: command not found", 2026-08-29) -- installed
      # explicitly instead of assumed.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version && ffprobe -version

      - name: Run RENDER
        run: npx tsx scripts/pipeline/render.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
