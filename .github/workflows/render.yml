name: RENDER

# Operator-triggered, not scheduled. One INVOCATION of render.ts does exactly
# one signal end-to-end (RESEARCH -> SCRIPT -> CRITIC -> FOOTAGE SELECT ->
# TTS -> ALIGN -> RENDER -> AUDIT -> EXPORT); this job invokes it `count`
# times, which is how many videos the operator lit shards for in stage 2.
# ALIGN runs only on the Gemini TTS narration path, and since 2026-09-01 its
# failure costs the render its exact caption timings rather than the whole
# video. PLAN and EDIT both exist now and both sit in that chain, between
# CRITIC and SOURCE and between SOURCE and RENDER respectively.
#
# The 3x/day cron was removed 2026-08-31. It was never the right shape for
# this system and the self-hosted runner is what settled it: footage only
# reaches the library from a residential IP (see footage-refresh.yml's
# comment), so the operator's machine is already a required participant in
# making a video. A cron that fires while that machine is asleep produces
# nothing, and a cron that fires while the operator is not watching produces
# a video nobody asked for — the console's guided run (plan v2 §7) exists
# precisely because the operator is present for the whole run and chooses
# what it makes. Dispatch is the honest trigger for work that needs a human
# and their laptop both.
on:
  workflow_dispatch:
    inputs:
      # Handed down by POST /console/dispatch (src/server/console/dispatch.ts).
      # The console records a `runs` row, hands its id here, and RENDER stamps
      # every stage and script with it — so stage 5 is polling the same trace
      # this job writes to. Before this input existed the two ends minted
      # separate ids and the waiting screen never saw the run it had started.
      #
      # Empty on a hand-triggered run: RENDER then mints its own, which is
      # the pre-console behaviour and still correct.
      trace_id:
        description: "Trace id to stamp every stage with. Leave empty to mint one."
        required: false
        default: ""
      count:
        description: "How many videos to render in this run (one signal each)."
        required: false
        default: "1"

permissions:
  contents: read

# One render at a time on the shared runner. `cancel-in-progress: false`
# because a half-finished render has already claimed a footage segment and a
# run pick; killing it strands both.
concurrency:
  group: pipeline-render
  cancel-in-progress: false

jobs:
  render:
    # The operator's laptop, the same machine FOOTAGE REFRESH runs on.
    # RENDER itself is not IP-gated — it makes no third-party video request —
    # but it is pointless anywhere else: the operator is present for the run
    # by design, and the clips it composites were sourced on this machine.
    #
    # These are the labels the registered runner actually reports.
    # `mythos-footage` was aspirational: no runner ever carried it, so every
    # dispatch queued forever waiting for a machine that does not exist
    # (found 2026-08-31, against the live runner listing). A dispatch made
    # while the runner is offline still queues, correctly — it starts when
    # the operator runs ./run.sh.
    runs-on: [self-hosted, macOS, ARM64]
    # 15 was sized for a 47-second video on a GitHub-hosted runner. v2's
    # ceiling is 180s of narration plus a character composite, and a laptop
    # is not a dedicated CI box, so 30 minutes per video is the working
    # figure — and `count` can be 6.
    #
    # Static, not `fromJSON(inputs.count) * 30`. That expression is not
    # accepted here: GitHub failed to parse the whole file and reported a
    # run with zero jobs whose name was the file path rather than RENDER
    # (2026-08-31). A job-level timeout is resolved before the dispatch
    # inputs are in scope, so the ceiling has to cover the largest run.
    # The per-video guard is inside the loop instead.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch the assets-library branch (footage clips live there, not in this checkout's ref)
        run: git fetch origin assets-library:assets-library || echo "assets-library branch doesn't exist remotely yet — nothing to render against"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same shape as footage-refresh.yml's ffmpeg step, and for the same
      # reason: a self-hosted macOS runner has no apt-get, and the tool is
      # usually already installed on a machine someone actually uses.
      - name: Install Edge TTS (edge_tts_synth.py's only Python dependency)
        run: |
          if python3 -c "import edge_tts" 2>/dev/null; then
            echo "edge_tts already present on this runner."
          else
            # Homebrew/system Pythons mark themselves externally-managed
            # (PEP 668) and refuse a plain --user install; --break-system-packages
            # is scoped to --user here, so it touches the user site directory
            # and never the system one.
            pip3 install --user edge-tts || pip3 install --user --break-system-packages edge-tts
          fi
          python3 -c "import edge_tts; print('edge_tts', edge_tts.__version__)"

      # "an ffmpeg is present" is NOT the requirement. RENDER burns captions
      # with the `ass` filter, which only exists in a build configured with
      # libass — and Homebrew's plain `ffmpeg` bottle is not one, while
      # `ffmpeg-full` is. Both can be installed at once, and the plain one
      # wins on PATH.
      #
      # This step used to accept the first ffmpeg it found, so the first
      # live RENDER got all the way through RESEARCH, SCRIPT, CRITIC,
      # FOOTAGE SELECT, TTS and ALIGN and then died in the encoder with
      #
      #   No option name near '.../captions.ass'
      #   Error parsing filterchain ... around: [v]
      #
      # which is what ffmpeg says when `ass` is not a filter it has: it
      # falls back to reading `ass=<path>` as an option assignment. It does
      # not say "no such filter", and it does not mention libass
      # (2026-08-31, run 33470463212).
      #
      # So the capability is probed, not assumed, and the build that has it
      # is put on PATH for the steps that follow.
      - name: Select an ffmpeg built with libass
        run: |
          has_ass() { [ -x "$1" ] && "$1" -hide_banner -filters 2>/dev/null | awk '$2=="ass"{f=1} END{exit !f}'; }

          FFMPEG=""
          for candidate in /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg /usr/local/opt/ffmpeg-full/bin/ffmpeg "$(command -v ffmpeg || true)"; do
            if has_ass "$candidate"; then FFMPEG="$candidate"; break; fi
          done

          if [ -z "$FFMPEG" ] && command -v apt-get >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
            has_ass "$(command -v ffmpeg)" && FFMPEG="$(command -v ffmpeg)"
          fi

          if [ -z "$FFMPEG" ]; then
            echo "::error::No ffmpeg with the 'ass' filter (libass) on this runner. RENDER cannot burn captions without it. On macOS: 'brew install ffmpeg-full'. Installed ffmpeg builds were: $(command -v -a ffmpeg | tr '\n' ' ')"
            exit 1
          fi

          BIN_DIR="$(dirname "$FFMPEG")"
          if ! [ -x "$BIN_DIR/ffprobe" ]; then
            echo "::error::found $FFMPEG but no ffprobe beside it in $BIN_DIR"
            exit 1
          fi

          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "Using $FFMPEG (has the ass filter)"
          "$FFMPEG" -version | head -1
          "$BIN_DIR/ffprobe" -version | head -1

      # EDIT drives Kinocut over MCP (src/lib/pipeline/edit.ts), which is a
      # Python package launched with `uvx`. Deliberately NOT a hard
      # requirement: EDIT fails soft to "every clip as sourced", so a runner
      # without uv still renders a complete video and the audit package says
      # the grade did not run. Failing the job here would trade a working
      # pipeline for a nicer-looking one.
      #
      # Kinocut is warmed rather than merely checked: `uvx` would otherwise
      # download and build the environment inside the first tool call, where
      # it counts against that call's timeout.
      - name: Warm Kinocut (EDIT's MCP server) — optional, never fatal
        continue-on-error: true
        run: |
          if ! command -v uvx >/dev/null; then
            echo "::warning::uvx not found — EDIT will be skipped and every clip used as sourced. Install with 'brew install uv' to enable it."
            exit 0
          fi
          uvx --from kinocut kino doctor || echo "::warning::kino doctor reported problems — EDIT may degrade."
          uvx --from kinocut kino --version || true

      # One invocation renders one signal end-to-end. The loop is here
      # rather than inside render.ts so that stays true: each video gets a
      # clean process, its own footage claim and its own run rows, and a
      # video that fails takes only itself down.
      #
      # `continue` rather than `set -e`: the operator queued N stories, and
      # losing stories 2 and 3 because story 1's CRITIC rejected a script is
      # not what they asked for. Every failure is counted and the job still
      # exits non-zero at the end, so a partly-failed run is never reported
      # as green.
      # Both inputs reach the shell through `env:` and are read as quoted
      # variables, never interpolated into the script with `${{ }}`. A
      # workflow input is untrusted text, and `${{ inputs.count }}` inline
      # would let a crafted dispatch inject shell into a job that holds
      # every pipeline credential.
      #
      # RENDER_COUNT is then range-checked rather than trusted: MAX_VIDEOS
      # in src/app/glass/videoGlass.ts is 6 and run-plan.ts enforces the
      # same ceiling, so anything outside 1..6 did not come from the
      # console.
      - name: Run RENDER
        run: |
          case "$RENDER_COUNT" in
            1|2|3|4|5|6) ;;
            *)
              echo "::error::count must be 1-6 (got '$RENDER_COUNT')"
              exit 1
              ;;
          esac
          echo "Rendering $RENDER_COUNT video(s) for trace ${PIPELINE_TRACE_ID:-<minted per invocation>}"

          # 30 minutes per video, enforced per invocation — the per-video
          # ceiling the job-level timeout cannot express, so one hung video
          # cannot eat the whole run's 180.
          #
          # `timeout` is GNU coreutils and is NOT on a stock macOS, which is
          # what this runner is; `gtimeout` is there only if the operator
          # installed coreutils. So it is resolved, not assumed — and when
          # neither exists the render still runs, unguarded, because losing
          # the run to a missing convenience would be the worse trade. The
          # job timeout is still the backstop.
          if command -v timeout >/dev/null; then GUARD="timeout 1800"
          elif command -v gtimeout >/dev/null; then GUARD="gtimeout 1800"
          else GUARD=""; echo "::warning::no timeout/gtimeout on this runner - per-video guard is off, the 180-minute job timeout is the only ceiling"; fi

          FAILED=0
          for i in $(seq 1 "$RENDER_COUNT"); do
            echo "::group::video $i of $RENDER_COUNT"
            if $GUARD npx tsx scripts/pipeline/render.ts; then
              echo "video $i succeeded"
            else
              echo "::error::video $i of $RENDER_COUNT failed — continuing with the rest of the run"
              FAILED=$((FAILED + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED of $RENDER_COUNT video(s) failed"
            exit 1
          fi
        env:
          RENDER_COUNT: ${{ inputs.count }}
          # Empty on a hand-triggered run, and render.ts mints its own then.
          PIPELINE_TRACE_ID: ${{ inputs.trace_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional. Absent, TTS runs on Edge — the default path, which
          # emits word timings natively and needs no ALIGN call. Present, the
          # narration is upgraded to Gemini within its 10-requests-per-day
          # budget (src/lib/pipeline/tts-select.ts).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Required only by the stock-montage footage mode
          # (src/lib/footage/stock.ts). A gameplay run never reads it, and a
          # stock run without it fails at FOOTAGE naming this variable
          # rather than quietly rendering something else.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Multi-statement writes go through the Worker's real D1 .batch()
          # (src/server/internal/d1-batch.ts); D1's REST API cannot do
          # parameterized and atomic in one call.
          PIPELINE_BATCH_TOKEN: ${{ secrets.PIPELINE_BATCH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
