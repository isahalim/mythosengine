name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks needs full history

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install gitleaks
        run: |
          tag=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          version=${tag#v}
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Install osv-scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Install semgrep
        run: pipx install semgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Not preinstalled on ubuntu-latest (same finding as footage-refresh.yml).
      # Without it, every ffmpeg-gated test (clip/motion-score/render-ffmpeg/
      # refresh/download-ytmp3-dom -- all use the hasFfmpeg()+skipIf
      # pattern) silently skips here, which is how src/lib/drivers/**'s branch
      # coverage dropped below the 80% threshold once the ytmp3 download driver
      # added enough ffmpeg-gated branches to matter (confirmed live, 2026-08-29).
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version && ffprobe -version

      # pnpm verify's test step drives both footage drivers
      # (youtube-search-dom.ts, download-ytmp3-dom.ts) against a real headless
      # Chromium and a local fixture site (no mock browser) -- needs the actual
      # binary present, same as footage-refresh.yml.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: pnpm verify
        run: pnpm verify

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Migrations run BEFORE the deploy, never after: a Worker whose code
      # expects a table the database doesn't have yet is exactly the outage
      # this step exists to prevent. 0007_mcp_tokens.sql was applied by hand
      # and missed, so every GET /console/summary 500'd on `select ... from
      # "mcp_tokens"` and the console showed "Console API not reachable" on
      # every page (2026-08-29). This is idempotent -- wrangler skips
      # anything already recorded in the `d1_migrations` ledger -- so a push
      # that adds no migration is a no-op.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply mythosengine --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
