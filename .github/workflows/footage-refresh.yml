name: FOOTAGE REFRESH

# Weekly (ARCHITECTURE.md §5.0) — the only stage that touches third-party
# video. Isolating this to one low-volume job is the mitigation this
# project chose for the footage-acquisition/YouTube ToS risk (see
# CLAUDE.md NEVER block and ARCHITECTURE.md §5.0's guardrails) — never run
# this more often, and never call it from the daily render job.
on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # the only pipeline workflow that pushes — to assets-library, never to main

concurrency:
  group: pipeline-footage-refresh
  cancel-in-progress: false

jobs:
  footage-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch the existing assets-library branch (absent only on the very first run)
        run: git fetch origin assets-library:assets-library || echo "assets-library branch doesn't exist remotely yet — this run will create it"

      - name: Configure git identity for the assets-library commits
        run: |
          git config user.name "mythosengine-bot"
          git config user.email "actions@users.noreply.github.com"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Not actually preinstalled on the current ubuntu-latest image, despite
      # GitHub's runner-images docs listing it (confirmed by a live run
      # failing with "ffmpeg: command not found", 2026-08-29) -- installed
      # explicitly instead of assumed.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version && ffprobe -version

      # playwright is a real, pinned npm dependency (package.json) -- this
      # just fetches the matching Chromium build. Replaces the yt-dlp
      # pin/checksum step and the YOUTUBE_COOKIES cookie workaround this
      # job used to need (ARCHITECTURE.md §5.0, 2026-08-28): footage
      # acquisition is now an agentic browser flow, not a yt-dlp subprocess.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run FOOTAGE REFRESH
        run: npx tsx scripts/pipeline/footage-refresh.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Push new clips to assets-library
        run: git push origin assets-library
