name: FOOTAGE REFRESH

# Weekly (ARCHITECTURE.md §5.0) — the only stage that touches third-party
# video. Isolating this to one low-volume job is the mitigation this
# project chose for the footage-acquisition/YouTube ToS risk (see
# CLAUDE.md NEVER block and ARCHITECTURE.md §5.0's guardrails) — never run
# this more often, and never call it from the daily render job.
on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # the only pipeline workflow that pushes — to assets-library, never to main

concurrency:
  group: pipeline-footage-refresh
  cancel-in-progress: false

jobs:
  footage-refresh:
    # Self-hosted, and that is the whole point of this job's setup.
    #
    # Neither acquisition route works from a GitHub-hosted runner, and both
    # fail for the same reason: the runner's IP is a datacenter address.
    # media.ytmp3.gg answers one with a "Service Discontinued" modal;
    # YouTube answers the other with "Sign in to confirm you're not a bot"
    # (measured, 2026-08-31 — run 33366544395). Both serve a working
    # response to a residential address, verified the same day. This is not
    # something driver code can fix, so the job runs somewhere YouTube
    # already trusts instead.
    #
    # Only this job needs it. RENDER and WATCH stay on GitHub-hosted
    # runners; nothing they touch is IP-gated.
    #
    # The `mythos-footage` label is what keeps this off any other
    # self-hosted runner that may exist later. Registering the machine is an
    # operator step (PROVISIONED.md); until it is registered this job queues
    # rather than failing.
    # See render.yml: `mythos-footage` was a label no registered runner ever
    # carried, so this queued forever. These are the operator laptop's real
    # labels.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch the existing assets-library branch (absent only on the very first run)
        run: git fetch origin assets-library:assets-library || echo "assets-library branch doesn't exist remotely yet — this run will create it"

      - name: Configure git identity for the assets-library commits
        run: |
          git config user.name "mythosengine-bot"
          git config user.email "actions@users.noreply.github.com"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Not actually preinstalled on the current ubuntu-latest image, despite
      # GitHub's runner-images docs listing it (confirmed by a live run
      # failing with "ffmpeg: command not found", 2026-08-29) -- installed
      # explicitly instead of assumed.
      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "ffmpeg already present on this runner."
          elif command -v apt-get >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          else
            echo "::error::ffmpeg/ffprobe not found and no apt-get to install them. Install ffmpeg on this self-hosted runner (e.g. 'brew install ffmpeg')."
            exit 1
          fi
          ffmpeg -version | head -1 && ffprobe -version | head -1

      # playwright is a real, pinned npm dependency (package.json) -- this
      # just fetches the matching Chromium build. Still needed whichever
      # acquisition route runs: the *search* leg reads youtube.com's results
      # page with a real browser either way, and the ytmp3 route drives its
      # converter with one. Both legs are deterministic and model-free.
      # `--with-deps` installs system libraries through apt and only exists
      # for Linux; on a macOS self-hosted runner it fails outright. The
      # browser download itself is the part that matters on both.
      - name: Install Playwright's Chromium
        run: |
          if command -v apt-get >/dev/null; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      # Pinned to an exact release and checksummed, the same supply-chain
      # discipline ARCHITECTURE.md states for ffmpeg -- the other non-npm
      # binary this pipeline shells out to. Deliberately not the npm wrapper
      # package (`yt-dlp-exec`): that is a single-maintainer republish of
      # this same binary, and CLAUDE.md's import rule exists to keep exactly
      # that out of the dependency tree.
      #
      # Installed into the runner's temp directory, not /usr/local/bin: a
      # self-hosted runner is someone's actual machine, and a CI job has no
      # business writing to its system paths or needing sudo to run. The
      # driver is told where it landed via YT_DLP_BIN.
      #
      # Checksums are per-asset, so the right one is selected with the right
      # binary; both come from the release's own SHA2-256SUMS.
      - name: Install yt-dlp (pinned)
        run: |
          case "$(uname -s)" in
            Darwin) ASSET=yt-dlp_macos; SUM="$YT_DLP_SHA256_MACOS" ;;
            Linux)  ASSET=yt-dlp_linux; SUM="$YT_DLP_SHA256_LINUX" ;;
            *) echo "::error::unsupported runner OS $(uname -s) for the pinned yt-dlp binary"; exit 1 ;;
          esac
          curl -sfL -o "$YT_DLP_BIN" \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${YT_DLP_VERSION}/${ASSET}"
          echo "${SUM}  ${YT_DLP_BIN}" | shasum -a 256 -c -
          chmod +x "$YT_DLP_BIN"
          "$YT_DLP_BIN" --version
        env:
          YT_DLP_BIN: ${{ runner.temp }}/yt-dlp
          YT_DLP_VERSION: "2026.08.19"
          YT_DLP_SHA256_LINUX: "58162f9bfdc27458ea47bfcb311cf47028f17d8154a8bf7d689861d46399230a"
          YT_DLP_SHA256_MACOS: "0f192b7ec147ab6288885d6351d9ab67367640029b4377576ef46dd79cf7b202"

      - name: Run FOOTAGE REFRESH
        run: npx tsx scripts/pipeline/footage-refresh.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # "ytdlp" (the default) or "ytmp3". Both routes are built and
          # tested; see buildDownloadDriver in the script for why there are
          # two and when the other one is the answer.
          FOOTAGE_DOWNLOADER: ytdlp
          YT_DLP_BIN: ${{ runner.temp }}/yt-dlp

      - name: Push new clips to assets-library
        run: git push origin assets-library
