name: FOOTAGE REFRESH

# Weekly (ARCHITECTURE.md §5.0) — the only stage that touches third-party
# video. Isolating this to one low-volume job is the mitigation this
# project chose for the yt-dlp/YouTube ToS risk (see CLAUDE.md NEVER block
# and ARCHITECTURE.md §5.0's "known risk, stated plainly" note) — never run
# this more often, and never call it from the daily render job.
on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # the only pipeline workflow that pushes — to assets-library, never to main

concurrency:
  group: pipeline-footage-refresh
  cancel-in-progress: false

jobs:
  footage-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch the existing assets-library branch (absent only on the very first run)
        run: git fetch origin assets-library:assets-library || echo "assets-library branch doesn't exist remotely yet — this run will create it"

      - name: Configure git identity for the assets-library commits
        run: |
          git config user.name "mythosengine-bot"
          git config user.email "actions@users.noreply.github.com"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned + checksum-verified (ARCHITECTURE.md §3: yt-dlp is a
      # non-npm binary dependency, same supply-chain discipline as a pinned
      # npm package applies) -- from yt-dlp-nightly-builds, not the stable
      # yt-dlp/yt-dlp releases used before. Deliberate, not a slip: stable
      # 2026.08.19 hits "The page needs to be reloaded" on every candidate
      # once cookies are added (confirmed live, 2026-08-29); the open
      # upstream issue (yt-dlp/yt-dlp#17389) is maintainer-acknowledged as
      # needing extractor changes only shipping in nightly/master so far,
      # not yet in a stable release. Revisit pinning back to stable once
      # that issue's fix reaches one. Checksum confirmed against yt-dlp's
      # own published SHA2-256SUMS for this exact nightly build, not
      # guessed.
      - name: Install yt-dlp (pinned nightly 2026.08.27.231323, checksum-verified)
        run: |
          curl -sSL -o yt-dlp https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/download/2026.08.27.231323/yt-dlp
          echo "4543ba905474a62edbf27af57a79068daae8f70812adec2d69a6052e4efb72f9  yt-dlp" | sha256sum -c -
          chmod +x yt-dlp
          sudo mv yt-dlp /usr/local/bin/yt-dlp

      # Not actually preinstalled on the current ubuntu-latest image, despite
      # GitHub's runner-images docs listing it (confirmed by a live run
      # failing with "ffmpeg: command not found", 2026-08-29) -- installed
      # explicitly instead of assumed.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version && ffprobe -version

      # YOUTUBE_COOKIES is a throwaway account's exported cookies, never the
      # operator's own (docs/DECISIONS.md, 2026-08-29) -- the only thing
      # that reliably clears YouTube's bot-check against GitHub's datacenter
      # IPs. Written to a runner-temp file, never a tracked file, never
      # logged; $RUNNER_TEMP is wiped when the job ends. Optional by
      # design -- src/lib/drivers/download-ytdlp.ts falls back to an
      # unauthenticated best-effort mode if this step writes nothing.
      - name: Write YouTube cookies file
        id: cookies
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
            echo "file=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_OUTPUT"
          fi
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Run FOOTAGE REFRESH
        run: npx tsx scripts/pipeline/footage-refresh.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES_FILE: ${{ steps.cookies.outputs.file }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Push new clips to assets-library
        run: git push origin assets-library
