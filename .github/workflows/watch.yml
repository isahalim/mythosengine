name: WATCH + SCORE

on:
  schedule:
    - cron: "0 * * * *" # hourly — ARCHITECTURE.md §5.1
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pipeline-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run WATCH + SCORE
        run: npx tsx scripts/pipeline/watch.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Multi-statement writes go through the Worker's real D1 .batch()
          # (src/server/internal/d1-batch.ts); D1's REST API cannot do
          # parameterized and atomic in one call.
          PIPELINE_BATCH_TOKEN: ${{ secrets.PIPELINE_BATCH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
