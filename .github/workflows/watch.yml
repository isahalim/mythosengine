name: WATCH + SCORE

on:
  schedule:
    - cron: "0 * * * *" # hourly — ARCHITECTURE.md §5.1
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pipeline-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run WATCH + SCORE
        run: npx tsx scripts/pipeline/watch.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Multi-statement writes go through the Worker's real D1 .batch()
          # (src/server/internal/d1-batch.ts); D1's REST API cannot do
          # parameterized and atomic in one call.
          PIPELINE_BATCH_TOKEN: ${{ secrets.PIPELINE_BATCH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
